<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Camberi">
  <!--
    The original Camberí mark, recovered from the legacy camberi.com. The
    outer shape and the circular cut-out are a single evenodd path, exactly
    as it was drawn there. The legacy site rendered it white on colour, so
    it keeps that treatment, here on the brand blue from the hero.

    The mark's geometry fills its 456×397 box edge to edge, so the tile inset
    is deliberately tight — any smaller and the cut-out closes up at 16px.
  -->
