<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Homunculus Topographic Hero</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        canvas { display: block; }
        #loader {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: white; font-family: monospace;
        }
    </style>
</head>
<body>
<div id="loader">LOADING TOPOGRAPHIC MAP...</div>

<script src="https://cdn.jsdelivr.net/npm/dat.gui@0.7.9/build/dat.gui.min.js"></script>

<script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
        }
    }
</script>

<script type="module">
    import * as THREE from 'three';

    // =========================================================================
    // CONFIGURATION
    // =========================================================================
    const CONFIG = {
        // Displacement/Ripple Settings (from experiment 4)
        gridSize: 50,
        brushSize: 100,
        maxScale: 1.5,
        fadeSpeed: 0.012,
        growthSpeed: 0.04,

        // Fluid Flow Settings
        distA: 0.64,          // amplitude like original
        distB: 2.5,           // closer to original frequency
        flowSpeed: 0.004,     // slow, heavy motion

        // Visual Settings
        ease: 0.0,            // pure topographic mode by default
        meEase: 0.28,         // strong mouse darkening, but not overwhelming
        mfBlack: 0.35,
        alpha: 1.0,
        noiseInfluence: 0.1,  // very subtle grain; structure from bands+mask

        // Alpha / contrast shaping
        minAlpha: 0.0,
        maxAlpha: 1.0,
        alphaPower: 2.0,      // stronger midtone compression, bigger dark gaps
        noiseBias: 0.6,
        noiseScale: 0.4,

        // Radial banding
        bandDensity: 2.6,     // slightly denser bands than your last preset
        bandWidth: 0.35,      // narrower lit bands -> larger dark areas between
    };

    // =========================================================================
    // TEXTURE GENERATION
    // =========================================================================

    // Create the topographic ribbon texture (horizontal color bands)
    function createTopographicTexture() {
        const canvas = document.createElement('canvas');
        canvas.width = 1024;
        canvas.height = 16;
        const ctx = canvas.getContext('2d');

        ctx.fillStyle = '#000000';
        ctx.fillRect(0, 0, 1024, 16);

        const grd = ctx.createLinearGradient(0, 0, 1024, 0);

        // Topographic color bands (inspired by homunculus.jp)
        grd.addColorStop(0.00, '#000000');

        // Band 1: Deep teal
        grd.addColorStop(0.10, '#000000');
        grd.addColorStop(0.15, '#006677');
        grd.addColorStop(0.20, '#000000');

        // Band 2: Copper/Orange
        grd.addColorStop(0.35, '#000000');
        grd.addColorStop(0.40, '#cc6633');
        grd.addColorStop(0.45, '#000000');

        // Band 3: Purple/Magenta
        grd.addColorStop(0.60, '#000000');
        grd.addColorStop(0.65, '#993366');
        grd.addColorStop(0.70, '#000000');

        // Band 4: Bright cyan
        grd.addColorStop(0.80, '#000000');
        grd.addColorStop(0.85, '#00aacc');
        grd.addColorStop(0.90, '#000000');

        // Band 5: White highlight
        grd.addColorStop(0.95, '#ffffff');
        grd.addColorStop(1.00, '#000000');

        ctx.fillStyle = grd;
        ctx.fillRect(0, 0, 1024, 16);

        const tex = new THREE.CanvasTexture(canvas);
        tex.wrapS = THREE.RepeatWrapping;
        tex.wrapT = THREE.RepeatWrapping;
        tex.minFilter = THREE.LinearFilter;
        tex.magFilter = THREE.LinearFilter;
        tex.needsUpdate = true;

        console.log('Topographic texture created:', tex);
        return tex;
    }

    // Create brush texture for displacement ripples
    function createBrushTexture() {
        const canvas = document.createElement('canvas');
        canvas.width = 64;
        canvas.height = 64;
        const ctx = canvas.getContext('2d');
        const grd = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
        grd.addColorStop(0, 'rgba(255, 255, 255, 1.0)');
        grd.addColorStop(1, 'rgba(0, 0, 0, 0.0)');
        ctx.fillStyle = grd;
        ctx.fillRect(0, 0, 64, 64);
        return new THREE.CanvasTexture(canvas);
    }

    // =========================================================================
    // SHADERS
    // =========================================================================

    const vertexShader = `
        varying vec2 vUv;
        void main() {
            vUv = uv;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
    `;

    // Simplex Noise (from experiment 3)
    const noiseShaderFragment = `
        uniform float cr, cg, cb;
        varying vec2 vUv;

        vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
        vec4 mod289(vec4 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
        vec4 permute(vec4 x) { return mod289(((x*34.0)+1.0)*x); }
        vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }

        float snoise(vec3 v) {
            const vec2  C = vec2(1.0/6.0, 1.0/3.0);
            const vec4  D = vec4(0.0, 0.5, 1.0, 2.0);
            vec3 i  = floor(v + dot(v, C.yyy));
            vec3 x0 =  v - i + dot(i, C.xxx);
            vec3 g = step(x0.yzx, x0.xyz);
            vec3 l = 1.0 - g;
            vec3 i1 = min(g.xyz, l.zxy);
            vec3 i2 = max(g.xyz, l.zxy);
            vec3 x1 = x0 - i1 + C.xxx;
            vec3 x2 = x0 - i2 + C.yyy;
            vec3 x3 = x0 - D.yyy;
            i = mod289(i);
            vec4 p = permute(permute(permute(
                        i.z + vec4(0.0, i1.z, i2.z, 1.0))
                        + i.y + vec4(0.0, i1.y, i2.y, 1.0))
                        + i.x + vec4(0.0, i1.x, i2.x, 1.0));
            float n_ = 0.142857142857;
            vec3  ns = n_ * D.wyz - D.xzx;
            vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
            vec4 x_ = floor(j * ns.z);
            vec4 y_ = floor(j - 7.0 * x_);
            vec4 x = x_ *ns.x + ns.yyyy;
            vec4 y = y_ *ns.x + ns.yyyy;
            vec4 h = 1.0 - abs(x) - abs(y);
            vec4 b0 = vec4(x.xy, y.xy);
            vec4 b1 = vec4(x.zw, y.zw);
            vec4 s0 = floor(b0)*2.0 + 1.0;
            vec4 s1 = floor(b1)*2.0 + 1.0;
            vec4 sh = -step(h, vec4(0.0));
            vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy;
            vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww;
            vec3 p0 = vec3(a0.xy,h.x);
            vec3 p1 = vec3(a0.zw,h.y);
            vec3 p2 = vec3(a1.xy,h.z);
            vec3 p3 = vec3(a1.zw,h.w);
            vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2,p2), dot(p3,p3)));
            p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
            vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
            m = m * m;
            return 42.0 * dot(m*m, vec4(dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3)));
        }

        void main() {
            float val1 = snoise(vec3(cr * vUv.x, cg * vUv.y, cb));
            gl_FragColor = vec4(val1, val1, val1, 1.0);
        }
    `;

    // Main display shader - matches homunculus.jp technique
    const displayFragment = `
        uniform sampler2D tDiffuse;
        uniform sampler2D tDisplacement;
        uniform sampler2D tNoise;
        uniform sampler2D tMask;
        uniform float time;
        uniform float ease;
        uniform float alpha;
        uniform float distA;
        uniform float distB;
        uniform float meEase;
        uniform float mfBlack;
        uniform float noiseInfluence;
        uniform vec2 resolution;
        uniform float minAlpha;
        uniform float maxAlpha;
        uniform float alphaPower;
        uniform float noiseBias;
        uniform float noiseScale;
        uniform float bandDensity;
        uniform float bandWidth;

        varying vec2 vUv;

        void main() {
            // Flow field and radial mapping (TEST 3B)
            vec2 ppp = -1.0 + 2.0 * vUv;
            float wscale = 1.6;

            ppp += 0.1 * cos((1.5 * wscale) * ppp.yx + 1.1 * time + vec2(0.1, 1.1));
            ppp += 0.1 * cos((2.3 * wscale) * ppp.yx + 1.3 * time + vec2(3.2, 3.4));
            ppp += 0.1 * cos((2.2 * wscale) * ppp.yx + 1.7 * time + vec2(1.8, 5.2));
            ppp += distA * cos((distB * wscale) * ppp.yx + 1.4 * time + vec2(6.3, 3.9));

            float r = length(ppp);

            // Ease blends between radial bands and straight image UVs
            float vx = (vUv.x * ease) + (r * (1.0 - ease));
            float vy = (vUv.y * ease) + (0.0 * (1.0 - ease));
            vec2 effectUv = vec2(vx, vy);

            // Sample image and mask using warped UVs
            vec4 col1 = texture2D(tDiffuse, effectUv);
            vec4 maskColor = texture2D(tMask, effectUv);

            // Use mask red channel and square it to deepen dark regions
            float maskA = maskColor.r * maskColor.r;

            vec3 mixCol = col1.rgb;

            // Base alpha from image and mask
            float baseA = col1.a * maskA * alpha;

            // Radial banding: thin bright bands, big dark gaps
            float bandCoord = r * bandDensity;
            float band = fract(bandCoord);
            float halfW = bandWidth * 0.5;

            // Centered band around 0.5 of each period
            float bandMask = smoothstep(0.5 - halfW, 0.5, band) *
                             (1.0 - smoothstep(0.5, 0.5 + halfW, band));

            float aa = baseA * bandMask;

            // Mouse effect darkening (acts like original mfBlack)
            vec4 mouseTex = texture2D(tDisplacement, vUv);
            float mouseStrength = mouseTex.r;
            float mouseDark = meEase * mfBlack * mouseStrength;

            aa *= (1.0 - mouseDark);
            mixCol *= (1.0 - mouseDark);

            // Noise aligned with effectUv so grain follows the bands (subtle)
            vec3 noiseC = texture2D(tNoise, effectUv * noiseScale).rgb;
            float n = noiseC.r;
            float nShifted = clamp((n - noiseBias) * 2.0 + 0.5, 0.0, 1.0);
            nShifted = pow(nShifted, 1.2);
            float grain = mix(1.0, nShifted, noiseInfluence);
            mixCol *= grain;

            // Final alpha shaping: push midtones down to create stronger dark zones
            aa = pow(max(aa, 0.0), alphaPower);
            aa = clamp(aa, minAlpha, maxAlpha);

            gl_FragColor = vec4(mixCol, aa);
        }
    `;

    // =========================================================================
    // MAIN APP
    // =========================================================================

    class TopographicApp {
        constructor() {
            this.width = window.innerWidth;
            this.height = window.innerHeight;

            // Renderer
            this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
            this.renderer.setSize(this.width, this.height);
            this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.body.appendChild(this.renderer.domElement);

            // Camera for main display (simple NDC)
            this.camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

            // Camera for FBO scene (needs pixel coordinates for brush placement)
            const frustumSize = this.height;
            const aspect = this.width / this.height;
            this.cameraFBO = new THREE.OrthographicCamera(
                -frustumSize * aspect / 2, frustumSize * aspect / 2,
                frustumSize / 2, -frustumSize / 2,
                -1000, 1000
            );
            this.cameraFBO.position.z = 2;

            // Three scenes for multi-pass rendering
            this.sceneFBO = new THREE.Scene();      // Mouse displacement ripples
            this.sceneNoise = new THREE.Scene();    // Simplex noise
            this.sceneMain = new THREE.Scene();     // Final display

            // State
            this.time = 0;
            this.mouse = new THREE.Vector2(0, 0);
            this.prevMouse = new THREE.Vector2(0, 0);
            this.currentWaveIdx = 0;

            console.log('TopographicApp constructor');
            this.setupGUI();
            this.init();
        }

        setupGUI() {
            // Create GUI
            this.gui = new dat.GUI();
            this.gui.width = 320;

            // Animation folder
            const animFolder = this.gui.addFolder('Animation');
            animFolder.add(CONFIG, 'flowSpeed', 0.0, 0.05, 0.0001).name('Flow Speed');
            animFolder.add(CONFIG, 'distA', 0.0, 2.0, 0.01).name('Wave Amplitude');
            animFolder.add(CONFIG, 'distB', 0.0, 20.0, 0.1).name('Wave Frequency');
            animFolder.open();

            // Visual folder
            const visualFolder = this.gui.addFolder('Visual');
            visualFolder.add(CONFIG, 'ease', 0.0, 1.0, 0.01).name('Ease (0=topo, 1=img)');
            visualFolder.add(CONFIG, 'alpha', 0.0, 2.0, 0.01).name('Overall Alpha');
            visualFolder.open();

            // Noise folder
            const noiseFolder = this.gui.addFolder('Noise');
            noiseFolder.add(CONFIG, 'noiseInfluence', 0.0, 2.0, 0.01).name('Noise Influence');
            noiseFolder.add(CONFIG, 'noiseBias', 0.0, 1.0, 0.01).name('Noise Bias');
            noiseFolder.add(CONFIG, 'noiseScale', 0.05, 1.0, 0.01).name('Noise Scale');
            noiseFolder.open();

            // Bands folder
            const bandsFolder = this.gui.addFolder('Bands');
            bandsFolder.add(CONFIG, 'bandDensity', 0.5, 8.0, 0.1).name('Band Density');
            bandsFolder.add(CONFIG, 'bandWidth', 0.05, 0.95, 0.01).name('Band Width');

            // Mouse effect folder
            const mouseFolder = this.gui.addFolder('Mouse Effect');
            mouseFolder.add(CONFIG, 'meEase', 0.0, 0.5, 0.005).name('Mouse Ease');
            mouseFolder.add(CONFIG, 'mfBlack', 0.0, 1.0, 0.01).name('Mouse Black');

            // Presets
            const presets = {
                'Original': () => {
                    CONFIG.flowSpeed = 0.004;
                    CONFIG.distA = 0.64;
                    CONFIG.distB = 2.5;
                    CONFIG.ease = 0.0;
                    CONFIG.alpha = 1.0;
                    CONFIG.noiseInfluence = 0.6;
                    CONFIG.noiseBias = 0.5;
                    CONFIG.noiseScale = 0.3;
                    CONFIG.bandDensity = 3.0;
                    CONFIG.bandWidth = 0.4;
                    CONFIG.meEase = 0.075;
                    CONFIG.mfBlack = 0.3;
                    this.gui.updateDisplay();
                },
                'Fast Flow': () => {
                    CONFIG.flowSpeed = 0.015;
                    CONFIG.distA = 0.8;
                    CONFIG.distB = 3.0;
                    this.gui.updateDisplay();
                },
                'Slow Motion': () => {
                    CONFIG.flowSpeed = 0.001;
                    CONFIG.distA = 0.4;
                    CONFIG.distB = 1.5;
                    this.gui.updateDisplay();
                },
                'Extreme Waves': () => {
                    CONFIG.flowSpeed = 0.008;
                    CONFIG.distA = 1.5;
                    CONFIG.distB = 8.0;
                    this.gui.updateDisplay();
                },
                'Export JSON': () => {
                    const json = JSON.stringify(CONFIG, null, 2);
                    console.log('CONFIG:', json);
                    alert('Config exported to console. Check browser console (F12).');
                }
            };

            const presetFolder = this.gui.addFolder('Presets');
            for (let name in presets) {
                if (name !== 'Export JSON') {
                    presetFolder.add(presets, name);
                }
            }
            this.gui.add(presets, 'Export JSON');
        }

        init() {
            console.log('Initializing...');
            // 1. Setup Render Targets
            this.fboTarget = new THREE.WebGLRenderTarget(this.width, this.height, {
                minFilter: THREE.LinearFilter,
                magFilter: THREE.LinearFilter,
                format: THREE.RGBAFormat,
            });

            this.noiseTarget = new THREE.WebGLRenderTarget(
                Math.floor(this.width / 2),
                Math.floor(this.height / 2),
                {
                    minFilter: THREE.LinearFilter,
                    magFilter: THREE.LinearFilter,
                }
            );

            // 2. Setup Brush Pool for Mouse Displacement
            this.brushes = [];
            const brushGeo = new THREE.PlaneGeometry(64, 64, 1, 1);
            const brushMat = new THREE.MeshBasicMaterial({
                map: createBrushTexture(),
                transparent: true,
                blending: THREE.AdditiveBlending,
                depthTest: false,
                depthWrite: false,
            });

            for (let i = 0; i < CONFIG.gridSize; i++) {
                const mesh = new THREE.Mesh(brushGeo, brushMat);
                mesh.rotation.z = Math.random() * Math.PI * 2;
                mesh.visible = false;
                this.sceneFBO.add(mesh);
                this.brushes.push(mesh);
            }

            // 3. Setup Noise Generation Scene
            const noiseMaterial = new THREE.ShaderMaterial({
                vertexShader: vertexShader,
                fragmentShader: noiseShaderFragment,
                uniforms: {
                    cr: { value: 7.0 },
                    cg: { value: 5.0 },
                    cb: { value: 0 }
                }
            });
            this.noiseMaterial = noiseMaterial;
            this.sceneNoise.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), noiseMaterial));

            // 4. Setup Main Display Scene with Image Loading
            const displayMaterial = new THREE.ShaderMaterial({
                vertexShader: vertexShader,
                fragmentShader: displayFragment,
                transparent: true,
                uniforms: {
                    tDiffuse: { value: null },
                    tDisplacement: { value: null },
                    tNoise: { value: null },
                    tMask: { value: null },
                    time: { value: 0 },
                    ease: { value: CONFIG.ease },
                    alpha: { value: CONFIG.alpha },
                    distA: { value: CONFIG.distA },
                    distB: { value: CONFIG.distB },
                    meEase: { value: CONFIG.meEase },
                    mfBlack: { value: CONFIG.mfBlack },
                    noiseInfluence: { value: CONFIG.noiseInfluence },
                    resolution: { value: new THREE.Vector2(this.width, this.height) },
                    minAlpha: { value: CONFIG.minAlpha },
                    maxAlpha: { value: CONFIG.maxAlpha },
                    alphaPower: { value: CONFIG.alphaPower },
                    noiseBias: { value: CONFIG.noiseBias },
                    noiseScale: { value: CONFIG.noiseScale },
                    bandDensity: { value: CONFIG.bandDensity },
                    bandWidth: { value: CONFIG.bandWidth },
                }
            });

            this.displayMaterial = displayMaterial;
            this.sceneMain.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), displayMaterial));

            // Load the background image
            const loader = new THREE.TextureLoader();

            // Track loading progress
            let loadedCount = 0;
            const totalToLoad = 2;
            const checkLoadComplete = () => {
                loadedCount++;
                if (loadedCount >= totalToLoad) {
                    console.log("All textures loaded");
                    document.getElementById('loader').style.display = 'none';
                }
            };

            // Load main background image
            loader.load(
                'static/thum.jpg',
                (tex) => {
                    console.log("Background image loaded successfully");
                    tex.wrapS = THREE.RepeatWrapping;
                    tex.wrapT = THREE.RepeatWrapping;
                    tex.minFilter = THREE.LinearFilter;
                    tex.magFilter = THREE.LinearFilter;
                    tex.needsUpdate = true;
                    this.displayMaterial.uniforms.tDiffuse.value = tex;
                    checkLoadComplete();
                },
                undefined,
                (err) => {
                    console.error("Failed to load image:", err);
                    const fallbackTexture = createTopographicTexture();
                    this.displayMaterial.uniforms.tDiffuse.value = fallbackTexture;
                    checkLoadComplete();
                }
            );

            // Load mask texture for empty spaces
            // Try detailMV_g.png first (the ribbon pattern from experiment3)
            loader.load(
                'static/detailMV_g.png',
                (tex) => {
                    console.log("Mask texture (detailMV_g.png) loaded successfully");
                    tex.wrapS = THREE.RepeatWrapping;
                    tex.wrapT = THREE.RepeatWrapping;
                    tex.minFilter = THREE.LinearFilter;
                    tex.magFilter = THREE.LinearFilter;
                    tex.needsUpdate = true;
                    this.displayMaterial.uniforms.tMask.value = tex;
                    checkLoadComplete();
                },
                undefined,
                (err) => {
                    console.warn("Failed to load detailMV_g.png, trying mv_mask.png:", err);
                    // Try alternative mask
                    loader.load(
                        'static/mv_mask.png',
                        (tex) => {
                            console.log("Alternative mask texture (mv_mask.png) loaded");
                            tex.wrapS = THREE.RepeatWrapping;
                            tex.wrapT = THREE.RepeatWrapping;
                            tex.minFilter = THREE.LinearFilter;
                            tex.magFilter = THREE.LinearFilter;
                            tex.needsUpdate = true;
                            this.displayMaterial.uniforms.tMask.value = tex;
                            checkLoadComplete();
                        },
                        undefined,
                        (err2) => {
                            console.warn("Failed to load mv_mask.png too:", err2);
                            // Create a simple white texture as fallback (no masking)
                            const canvas = document.createElement('canvas');
                            canvas.width = canvas.height = 2;
                            const ctx = canvas.getContext('2d');
                            ctx.fillStyle = 'white';
                            ctx.fillRect(0, 0, 2, 2);
                            const fallbackMask = new THREE.CanvasTexture(canvas);
                            this.displayMaterial.uniforms.tMask.value = fallbackMask;
                            checkLoadComplete();
                        }
                    );
                }
            );

            // Event Listeners
            window.addEventListener('resize', this.resize.bind(this));
            window.addEventListener('mousemove', this.onMouseMove.bind(this));

            this.resize();

            console.log('Setup complete, starting animation');
            document.getElementById('loader').style.display = 'none';

            this.animate();
        }

        onMouseMove(e) {
            // Convert to Three.js coordinate space
            const frustumSize = this.height;
            const aspect = this.width / this.height;
            this.mouse.x = (e.clientX - this.width / 2);
            this.mouse.y = (this.height / 2 - e.clientY);
        }

        setNewWave(x, y, index) {
            const mesh = this.brushes[index];
            mesh.visible = true;
            mesh.position.x = x;
            mesh.position.y = y;
            mesh.scale.setScalar(CONFIG.brushSize);
            mesh.material.opacity = 0.5;
            mesh.rotation.z = Math.random() * Math.PI;
        }

        trackMouse() {
            const dx = this.mouse.x - this.prevMouse.x;
            const dy = this.mouse.y - this.prevMouse.y;
            const dist = Math.sqrt(dx * dx + dy * dy);

            if (dist > 5) {
                this.currentWaveIdx = (this.currentWaveIdx + 1) % CONFIG.gridSize;
                this.setNewWave(this.mouse.x, this.mouse.y, this.currentWaveIdx);
                this.prevMouse.copy(this.mouse);
            }
        }

        updateBrushes() {
            this.brushes.forEach((mesh) => {
                if (mesh.visible) {
                    mesh.rotation.z += 0.02;
                    mesh.material.opacity *= (1 - CONFIG.fadeSpeed);
                    mesh.scale.x += CONFIG.growthSpeed;
                    mesh.scale.y = mesh.scale.x;

                    if (mesh.material.opacity < 0.01) {
                        mesh.visible = false;
                    }
                }
            });
        }

        resize() {
            this.width = window.innerWidth;
            this.height = window.innerHeight;

            this.renderer.setSize(this.width, this.height);
            this.fboTarget.setSize(this.width, this.height);
            this.noiseTarget.setSize(Math.floor(this.width / 2), Math.floor(this.height / 2));

            // Update FBO camera frustum for pixel-space brush coordinates
            const frustumSize = this.height;
            const aspect = this.width / this.height;
            this.cameraFBO.left = -frustumSize * aspect / 2;
            this.cameraFBO.right = frustumSize * aspect / 2;
            this.cameraFBO.top = frustumSize / 2;
            this.cameraFBO.bottom = -frustumSize / 2;
            this.cameraFBO.updateProjectionMatrix();

            this.displayMaterial.uniforms.resolution.value.set(this.width, this.height);
        }

        animate() {
            requestAnimationFrame(this.animate.bind(this));
            this.time += CONFIG.flowSpeed;

            if (!this.frameCount) {
                this.frameCount = 0;
            }
            if (this.frameCount === 0) {
                console.log('First frame rendering...');
            }
            this.frameCount++;

            // 0. Update mouse displacement ripples
            this.trackMouse();
            this.updateBrushes();

            // 1. Render displacement FBO
            this.renderer.setRenderTarget(this.fboTarget);
            this.renderer.clear();
            this.renderer.render(this.sceneFBO, this.cameraFBO);

            // 2. Update and render noise
            this.noiseMaterial.uniforms.cb.value += 0.005;
            this.renderer.setRenderTarget(this.noiseTarget);
            this.renderer.render(this.sceneNoise, this.camera);

            // 3. Update main shader uniforms (including GUI-controlled values)
            this.displayMaterial.uniforms.tDisplacement.value = this.fboTarget.texture;
            this.displayMaterial.uniforms.tNoise.value = this.noiseTarget.texture;
            this.displayMaterial.uniforms.time.value = this.time;
            this.displayMaterial.uniforms.ease.value = CONFIG.ease;
            this.displayMaterial.uniforms.alpha.value = CONFIG.alpha;
            this.displayMaterial.uniforms.distA.value = CONFIG.distA;
            this.displayMaterial.uniforms.distB.value = CONFIG.distB;
            this.displayMaterial.uniforms.noiseInfluence.value = CONFIG.noiseInfluence;
            this.displayMaterial.uniforms.meEase.value = CONFIG.meEase;
            this.displayMaterial.uniforms.mfBlack.value = CONFIG.mfBlack;
            this.displayMaterial.uniforms.minAlpha.value = CONFIG.minAlpha;
            this.displayMaterial.uniforms.maxAlpha.value = CONFIG.maxAlpha;
            this.displayMaterial.uniforms.alphaPower.value = CONFIG.alphaPower;
            this.displayMaterial.uniforms.noiseBias.value = CONFIG.noiseBias;
            this.displayMaterial.uniforms.noiseScale.value = CONFIG.noiseScale;
            this.displayMaterial.uniforms.bandDensity.value = CONFIG.bandDensity;
            this.displayMaterial.uniforms.bandWidth.value = CONFIG.bandWidth;
            this.displayMaterial.uniforms.resolution.value.set(this.width, this.height);

            // 4. Render final scene to screen
            this.renderer.setRenderTarget(null);
            this.renderer.render(this.sceneMain, this.camera);
        }
    }

    new TopographicApp();
</script>
</body>
