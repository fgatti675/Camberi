<!doctype html>
<html lang="en">
  <head>
    <!--
      Development shell only.

      Every page's real <head> — title, description, canonical, hreflang,
      og/twitter, favicons, font preloads, the language script and the JSON-LD
      — is generated per route per language by `src/routes/head.ts` and written
      to disk by `scripts/prerender.mjs`. That is the single source of truth.

      Nothing added to this file reaches production. Vite needs an entry to
      bundle and `pnpm dev` needs something to serve; that is all this is. Vite
      also falls back to it for any unknown path, which is what makes
      /legal/, /es/legal/ and everything else work in dev — the client picks
      its page and its language from location.pathname.

      To see a real page head, run `pnpm build && pnpm preview`.
    -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Camberi — dev</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
