    <!--
      Language routing. Each language is a real URL (`/` and `/es/`) so both
      get indexed. This runs before anything paints, so a Spanish visitor
      never sees an English flash.

      Only the English root redirects; `/es/` never does. That keeps the rule
      loop-free and means a deliberate /es/ link always wins. A choice made
      with the header switcher is stored and beats browser detection forever
      after.
    -->
    <script>
      (function () {
        try {
          var stored = null;
          try { stored = localStorage.getItem('camberi-lang'); } catch (e) {}
          if (stored === 'en') return;
          var wantsEs = stored === 'es';
          if (!stored) {
            var langs = (navigator.languages && navigator.languages.length)
              ? navigator.languages
              : [navigator.language || ''];
            wantsEs = /^es\b/i.test(langs[0] || '');
          }
          if (wantsEs) location.replace('/es/' + location.search + location.hash);
        } catch (e) {}
      })();
    </script>
